name: SmartHome
options:
  bundleIdPrefix: com.example.smarthome
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  SmartHome:
    type: application
    platform: iOS
    sources: [Sources/SmartHome]
    info:
      path: Sources/SmartHome/Info.plist
      properties:
        CFBundleDisplayName: Akıllı Ev
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smarthome.app
        GENERATE_INFOPLIST_FILE: NO
  SmartHomeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/SmartHomeTests]
    dependencies:
      - target: SmartHome
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.smarthome.tests
schemes:
  SmartHome:
    build:
      targets:
        SmartHome: all
        SmartHomeTests: [test]
    test:
      targets: [SmartHomeTests]
