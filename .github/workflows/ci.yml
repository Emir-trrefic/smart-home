name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Kilit dosyası henüz yok, ilk yeşil çalışmadan sonra package-lock.json eklenip `npm ci` kullanılacak.
      - run: npm install --no-audit --no-fund
      # Hata çıktısı tek bir annotation olarak da yazılır, böylece loglara erişemeyen araçlar da okuyabilir.
      - name: Typecheck
        run: |
          if ! npm run typecheck > "$RUNNER_TEMP/typecheck.log" 2>&1; then
            cat "$RUNNER_TEMP/typecheck.log"
            msg=$(head -c 3000 "$RUNNER_TEMP/typecheck.log" | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=typecheck::${msg}"
            exit 1
          fi
      - name: Test
        run: |
          if ! npm test > "$RUNNER_TEMP/test.log" 2>&1; then
            tail -n 120 "$RUNNER_TEMP/test.log"
            msg=$(grep -E '^(not ok|# fail|# pass)|Error|error:' "$RUNNER_TEMP/test.log" | head -c 3000 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=test::${msg}"
            exit 1
          fi
          grep -E '^# (tests|pass|fail)' "$RUNNER_TEMP/test.log"

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen kurulumu
        run: brew install xcodegen
      - name: Proje üret
        working-directory: apps/ios
        run: xcodegen generate
      - name: Derle ve test et (simülatör)
        working-directory: apps/ios
        run: |
          set -o pipefail
          DEST=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']))")
          xcodebuild test -project SmartHome.xcodeproj -scheme SmartHome -destination "id=$DEST" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log | tail -n 60
      - name: Hata özeti
        if: failure()
        working-directory: apps/ios
        run: grep -E "error:|Test Case.*failed" build.log | head -20 | while read -r l; do echo "::error::$l"; done

